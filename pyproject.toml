[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractguard"
version = "0.1.0"
description = "AI-assisted contract risk and compliance review flags (not legal advice)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
    "jsonschema",
    "pymupdf",
    "python-docx",
    "pytesseract",
    "Pillow",
    "spacy",
    "scikit-learn",
    "sentence-transformers",
    "numpy",
    "pandas",
    "dateparser",
    "rapidfuzz",
    "google-genai",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
training = ["datasets"]
app = ["fastapi", "uvicorn", "python-multipart", "sqlmodel", "streamlit", "requests"]
dev = ["pytest", "httpx", "ruff", "mypy", "reportlab"]

[project.scripts]
contractguard = "contractguard.cli:main"

[tool.setuptools.packages.find]
include = ["contractguard*", "backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"contractguard/llm/prompts.py" = ["E501"]  # prompt text is kept verbatim

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
files = ["contractguard", "backend"]
