[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractguard"
version = "0.1.0"
description = "AI-assisted contract risk and compliance review flags (not legal advice)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
    "jsonschema",
    "pymupdf",
    "python-docx",
    "pytesseract",
    "Pillow",
    "spacy",
    "scikit-learn",
    "sentence-transformers",
    "numpy",
    "pandas",
    "dateparser",
    "rapidfuzz",
    "google-genai",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
training = ["datasets"]
ollama = ["ollama"]
app = ["fastapi", "uvicorn", "python-multipart", "sqlmodel", "streamlit", "requests"]
dev = ["pytest", "httpx", "ruff", "reportlab"]

[project.scripts]
contractguard = "contractguard.cli:main"

[tool.setuptools.packages.find]
include = ["contractguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
