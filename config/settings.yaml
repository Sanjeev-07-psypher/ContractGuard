# ContractGuard runtime settings (HLD Section 13).
# Values marked "tuned" are re-set from validation results; record final values in docs/DECISIONS.md.
limits: {max_file_mb: 20, max_pages: 60, max_docx_words: 60000}
ocr: {min_chars_per_page: 50, dpi: 300, warn_confidence: 70, tesseract_cmd: null, lang: eng}
segmentation: {min_chars: 40, max_chars: 3000, fallback_min_headings: 3}
classification: {model_path: models/classifier.joblib, thresholds_path: models/thresholds.json}
embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  proto_threshold: 0.50          # tuned
  prototypes_path: models/prototypes.npy
policy: {default_policy_id: default_vendor_v1, tau_missing: 0.55, policies_dir: policies}
llm: {provider: gemini, model: null, rpm: 8, max_findings: 15, temperature: 0.2, timeout_s: 30, max_retries: 3}
org: {default_name: "ABC Technologies Pvt. Ltd.", date_order: DMY}
frontend: {api_url: "http://localhost:8000/api/v1", poll_seconds: 2}
paths: {data_dir: data, uploads_dir: data/uploads, sqlite_path: data/contractguard.db, models_dir: models}
disclaimer: "ContractGuard produces AI-assisted review flags to support contract reviewers. It is not legal advice and does not determine legal validity."
