# Regex / phrase patterns (HLD 6.2, 6.3, 6.4, 7.1, 7.3).
# Python `re` syntax. Matching is case-sensitive unless a pattern carries (?i).

cleaning:
  page_number_line: '(?i)^\s*(page\s*)?\d+(\s*(of|/)\s*\d+)?\s*$'
  dehyphenate: '(\w)-\n(\w)'
  header_footer_lines: 3          # top/bottom N lines per page considered
  header_footer_min_ratio: 0.5    # fraction of pages a line must appear on
  header_footer_min_pages: 3
  soft_wrap_end: '[.:;]\s*$'          # a line ending like this is NOT joined to the next
  soft_wrap_next: '^([a-z]|\(\d{1,3}\)\s+[a-z])'  # next line starts lowercase, or "(15) days" after "fifteen"
  number_only_line: '^\(?(\d{1,2}(\.\d{1,2})*|[a-z]|[ivx]+)[.)]?$'  # "10.1" alone on a line

segmentation:
  l1:
    - '^(ARTICLE|Article)\s+[IVXLCl1i|\d]+'  # l, 1, i and |: OCR misreads of I
    - '^\d{1,2}\.\s+[A-Z]'
    - '^\d{1,2}\s+[A-Z][A-Z ]{3,}$'
    - '^SECTION\s+\d+'
  l2:
    - '^\d{1,2}\.\d{1,2}\.?\s+'
  l3:
    - '^\(?[a-z]\)\s+'
    - '^\(?[ivx]+\)\s+'
    - '^\d{1,2}\.\d{1,2}\.\d{1,2}'
  definitions_heading: '(?i)definitions|interpretation'
  exhibit_heading: '(?i)^\s*(exhibit|schedule|annex|appendix)\b'
  signature: '(?i)in witness whereof|^\s*signature|^\s*by:'
  fallback_merge_chars: 200
  # Parsing a clause-start line into number + heading (first match wins).
  parse:
    - '^(?:ARTICLE|Article)\s+(?P<num>[IVXLCl1i|\d]+)(?![A-Za-z])\s*[-:.]?\s*(?P<rest>.*)$'
    - '^SECTION\s+(?P<num>\d+)\b\s*[-:.]?\s*(?P<rest>.*)$'
    - '^(?P<num>\d{1,2}(?:\.\d{1,2})?)\.?\s+(?P<rest>.*)$'
  heading_max_words: 12      # a start line longer than this (or ending in ".") has no heading
  docx_heading_style: '^Heading'

sla_keywords:
  - '(?i)service level'
  - '\bSLA\b'
  - '(?i)uptime'
  - '(?i)availability of \d+(\.\d+)?\s?%'
  - '(?i)response time'
  - '(?i)resolution time'
  - '(?i)service credits'

# Hand-written SLA examples: added to the SLA prototype (HLD 6.4), which has no training data.
sla_prototypes:
  - "The Vendor shall ensure that the Services are available at least 99.5% of the time in each calendar month."
  - "Service levels: the Provider shall meet the service levels set out in Schedule 2 and report on them monthly."
  - "If monthly availability falls below the committed level, the Customer shall be entitled to service credits."
  - "The Contractor shall respond to Priority 1 incidents within one hour and resolve them within four hours."
  - "Scheduled maintenance is excluded from downtime, provided the Customer is notified at least 48 hours in advance."
  - "The Supplier shall maintain a help desk available 24 hours a day, seven days a week, to log support requests."
  - "Uptime shall be measured monthly, excluding planned maintenance windows agreed in advance."
  - "Failure to meet the response time targets for three consecutive months shall entitle the Company to terminate."
  - "The Provider shall deliver a monthly performance report showing achievement against each key performance indicator."
  - "Support requests shall be acknowledged within 30 minutes during business hours."

parties:
  # alias = the quoted words inside the parentheses after each name; the opening quote may be
  # lost to OCR ('(the Provider")'), so it is optional
  preamble: '(?is)between\s+(?P<a>.+?)\s*\((?:[^()"]*?")?(?P<alias_a>[^"()]+)"\s*\)\s*,?\s*and\s+(?P<b>.+?)\s*\((?:[^()"]*?")?(?P<alias_b>[^"()]+)"\s*\)'
  fuzzy_threshold: 85
  # a party's name ends at the first descriptor ("ABC Ltd., a company incorporated ...")
  name_end: '(?i),\s+(a|an|having|with|incorporated|registered|whose)\b|\s+having\b|\s+with its\b'
  our_org_aliases: [Company, Client, Customer, Licensee, Buyer, Purchaser]
  counterparty_aliases: [Vendor, Supplier, Service Provider, Provider, Contractor, Consultant, Licensor, Seller]

dates:
  effective: '(?i)(effective\s+(as\s+of|date|from)|with effect from|dated)'
  # date expressions; parsed with dateparser using org.date_order
  formats:
    - '(?i)\b\d{1,2}(st|nd|rd|th)?\s+day\s+of\s+(january|february|march|april|may|june|july|august|september|october|november|december),?\s+\d{4}'
    - '(?i)\b\d{1,2}(st|nd|rd|th)?\s+(january|february|march|april|may|june|july|august|september|october|november|december),?\s+\d{4}'
    - '(?i)\b(january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{1,2}(st|nd|rd|th)?,?\s+\d{4}'
    - '\b\d{1,2}[/.-]\d{1,2}[/.-]\d{4}\b'
  expiry: '(?i)(expire|terminate automatically|end)s?\s+on'
  # term of the agreement; {dur} is replaced by the duration regex. A term counts towards the
  # expiry date only if its sentence ties it to the Effective Date (start_anchor).
  term:
    - '(?i)initial\s+(\w+\s+)?term\s+(of|is)\s+{dur}'
    - '(?i)\b(license|subscription|rental)\s+(term|period)\s+is\s+{dur}'
    - '(?i)for\s+a\s+period\s+of\s+{dur}'
    - '(?i)remain\s+in\s+force\s+for\s+{dur}'
    - '(?i){dur}\s+from\s+the\s+effective\s+date'
  start_anchor: '(?i)effective date'

durations:
  # multiplier to days per unit (HLD 7.2); business/working days -> ceil(n * 7 / 5)
  unit_days: {day: 1, week: 7, month: 30, year: 365}
  business_qualifiers: [business, working]
  other_qualifiers: [calendar, consecutive]
  net: '(?i)\bnet\s*(?P<n>\d{1,3})\b'

governing_law:
  jurisdiction: 'laws of (the )?(State of )?(?P<j>[A-Z][A-Za-z ]+?)(,|\.| and| without)'
  aliases:
    Karnataka: India (Karnataka)
    Maharashtra: India (Maharashtra)
    Tamil Nadu: India (Tamil Nadu)
    Delhi: India (Delhi)
    India: India
    Republic of India: India
    New York: USA (New York)
    England and Wales: UK (England and Wales)
    England: UK (England and Wales)
    Singapore: Singapore

facts:
  negation_cues: ['\bnot\b', '\bno\b', '(?i)in no event', '(?i)shall not', '(?i)\bneither\b']
  negation_window_tokens: 8
  termination:
    keyword: '(?i)terminat\w*'
    notice: '(?i)notice|prior written'
    window_tokens: 12
    # a duration introduced by "within" is a cure or payment period, not a notice period
    cure: '(?i)\bwithin\s*$'
    subject_end: '(?i)\b(may|shall|will|can)\b[^.]{0,40}?terminat|\bterminat'
    convenience: ['(?i)for convenience', '(?i)without cause', '(?i)for any reason', '(?i)at any time']
    mutual: ['(?i)either party', '(?i)both parties']
  liability:
    cap:
      - '(?i)shall not exceed'
      - '(?i)limited to'
      - '(?i)in no event .{0,80} exceed'
      - '(?i)aggregate liability .{0,60} (not exceed|limited)'
      - '(?i)maximum (aggregate )?liability'
    uncapped:
      - '(?i)unlimited liability'
      - '(?i)without (any )?limit(ation)? (as to|on) (the )?amount'
      - '(?i)liable for all (losses|damages)'
      - '(?i)any and all (losses|damages)'
    # applies to cap and uncapped patterns: "including but not limited to" is not a cap
    exclusions: ['(?i)including,?\s+(but\s+not\s+limited\s+to|without\s+limitation)']
    carve_out: '(?i)(cap|limitation).{0,40}shall not apply'
  renewal:
    automatic:
      - '(?i)automatic(ally)? renew'
      - '(?i)shall renew (automatically|for successive)'
      - '(?i)evergreen'
      - '(?i)unless .{0,40}notice of non-renewal'
    manual: ['(?i)may be renewed by mutual (written )?agreement']
  payment:
    sentence: '(?i)invoice|payment'
    trigger: '(?i)\b(within|net|no later than)\b'

sentences:
  # a sentence ending in one of these does not end there (spaCy's sentencizer splits on ".")
  abbreviations: [Pvt., No., Nos., Rs., Mr., Ms., Mrs., Dr., St., Sr., Jr., viz., e.g., i.e., cf., Co., Inc., Ltd., Corp., Cl., Art., Sec.]
