# Dataset label -> ContractGuard category (HLD 6.4).
#
# Only label names actually printed by `python training/inspect_labels.py` may be used.
# CUAD: verified 2026-10-25 against CUADv1.json (docs/labels_cuad.txt, 41 categories).
# LEDGAR: every name below appears in the LexGLUE dataset card's LEDGAR label list
# (huggingface.co/datasets/coastalcph/lex_glue README), but the script has not printed them from the
# dataset itself yet, because dataset file downloads are blocked in the build environment.
# LEDGAR has no liability label, so LIABILITY comes from CUAD only. Unmapped labels go to OTHER.
verified: false

ledgar:
  CONFIDENTIALITY: [Confidentiality]
  TERMINATION: [Terminations]
  PAYMENT: [Payments, Fees]
  INDEMNIFICATION: [Indemnifications, Indemnity]
  IP: [Intellectual Property]
  GOVERNING_LAW: [Governing Laws]
  LIABILITY: []

cuad:
  TERMINATION: [Termination For Convenience]
  LIABILITY: [Cap On Liability, Uncapped Liability]
  IP: [Ip Ownership Assignment]
  GOVERNING_LAW: [Governing Law]
  RENEWAL: [Renewal Term, Notice Period To Terminate Renewal]

# CUAD paragraphs without an annotation count as negatives only for these categories (D39).
# TERMINATION and IP map to narrow CUAD labels (convenience termination, IP assignment), so a CUAD
# paragraph about termination for cause or a licence is not a negative example for them.
cuad_negatives: [LIABILITY, GOVERNING_LAW, RENEWAL]

# SLA has no public labels: keyword rules + prototypes only.
