# GC05: SAAS_LICENSE (on-premise software licence).
# Planted: New York governing law (R08); no cap and an uncapped "any and all losses" sentence
# (R01, R02); no SLA (R06 MISSING). Negation test: "shall not be liable for any and all damages"
# must NOT count as uncapped. Compliant: 90 days' mutual notice "for any reason", renewal by mutual
# agreement, 60-day payment, indemnity, confidentiality.
id: gc05
contract_type: SAAS_LICENSE
title: SOFTWARE LICENSE AGREEMENT
short_title: Software License Agreement
heading_style: num_caps
numbering: text
our_org: ABC Technologies Pvt. Ltd.
counterparty: DataSutra Analytics LLP

preamble:
  - This Software License Agreement is dated 3rd August 2026 (the "Effective Date")
  - and is made between DataSutra Analytics LLP, a limited liability partnership registered under the Limited Liability Partnership Act, 2008, having its principal office at 88, Sector 44, Gurugram 122003 (the "Licensor"), and ABC Technologies Pvt. Ltd., a company having its registered office at 4th Floor, Prestige Tech Park, Outer Ring Road, Bengaluru 560103 (the "Licensee").
  - The Licensor has developed a data analytics software product known as SutraInsight, and the Licensee wishes to obtain a license to install and use it on its own servers.

clauses:
  - number: "1"
    heading: Definitions
    kind: DEFINITIONS
    categories: []
    body:
      - '(a) "Software" means the SutraInsight software in object code form, including all updates supplied under this Agreement.'
      - (b) "Documentation" means the user manuals and technical documentation supplied with the Software.
      - (c) "License Term" means the period described in Clause 11.

  - number: "2"
    heading: Grant of License
    categories: [OTHER]
    body:
      - The Licensor grants the Licensee a non-exclusive, non-transferable license to install and use the Software on up to ten (10) servers located in India, for the Licensee's internal business purposes, during the License Term.

  - number: "3"
    heading: License Restrictions
    categories: [OTHER]
    body:
      - The Licensee shall not (i) copy the Software except for back-up purposes, (ii) modify, decompile or reverse engineer the Software, or (iii) rent, lease or sublicense the Software to any third party.

  - number: "4"
    heading: Delivery and Installation
    categories: [OTHER]
    body:
      - The Licensor shall deliver the Software and Documentation electronically within ten (10) days of the Effective Date and shall provide remote installation assistance at no additional charge.

  - number: "5"
    heading: License Fees and Payment
    categories: [PAYMENT]
    body:
      - The Licensee shall pay a one-time license fee of INR 42,00,000 and an annual maintenance fee of INR 6,30,000, plus applicable taxes.
      - The Licensor shall invoice the license fee on delivery and the annual maintenance fee at the start of each year of the License Term. The Licensee shall pay each invoice within sixty (60) days of receipt of invoice.

  - number: "6"
    heading: Warranty
    categories: [OTHER]
    body:
      - The Licensor warrants that for ninety (90) days from delivery the Software will perform materially in accordance with the Documentation. The Licensor's sole obligation for breach of this warranty is to correct or replace the non-conforming Software.

  - number: "7"
    heading: Ownership of Intellectual Property
    categories: [IP]
    body:
      - The Software and Documentation, and all intellectual property rights in them, are and shall remain the property of the Licensor. All reports and outputs generated by the Licensee using the Software belong to the Licensee.

  - number: "8"
    heading: Confidentiality
    categories: [CONFIDENTIALITY]
    body:
      - Each Party shall hold the confidential information of the other Party in confidence and shall not disclose it to any third party, except to its employees and professional advisers who are bound by equivalent obligations of confidentiality. The Software is the confidential information of the Licensor.

  - number: "9"
    heading: Indemnification
    categories: [INDEMNIFICATION]
    body:
      - The Licensor shall indemnify the Licensee against all losses, damages and costs arising from any claim that the use of the Software in accordance with this Agreement infringes any patent, copyright or trade secret of a third party.

  - number: "10"
    heading: Liability
    sub:
      - number: "10.1"
        categories: [LIABILITY]
        body:
          - The Licensee shall be liable for any and all losses suffered by the Licensor as a result of any breach by the Licensee of Clause 3 (License Restrictions) or Clause 8 (Confidentiality).
      - number: "10.2"
        categories: [LIABILITY]
        body:
          - The Licensor shall not be liable for any and all damages arising from the use of the Software in combination with hardware or software not supplied or approved by the Licensor.

  - number: "11"
    heading: Term and Renewal
    categories: [RENEWAL]
    body:
      - The License Term is five (5) years from the Effective Date. The License Term may be renewed by mutual written agreement of the Parties on terms to be agreed.

  - number: "12"
    heading: Termination
    categories: [TERMINATION]
    body:
      - Either Party may terminate this Agreement for any reason upon ninety (90) days' prior written notice to the other Party.
      - On termination the Licensee shall stop using the Software and shall delete all copies of it, and shall certify the deletion in writing within fifteen (15) days.

  - number: "13"
    heading: Governing Law
    categories: [GOVERNING_LAW]
    body:
      - This Agreement shall be governed by the laws of the State of New York, without regard to its conflict of laws principles, and the parties submit to the jurisdiction of the state and federal courts located in New York County.

  - number: "14"
    heading: General
    categories: [OTHER]
    body:
      - Neither Party may assign this Agreement without the prior written consent of the other Party. Any notice must be in writing. This Agreement is the entire agreement between the Parties regarding the Software.

signature:
  - IN WITNESS WHEREOF the Parties have executed this Agreement on the Effective Date.
  - For DataSutra Analytics LLP
  - "By: ____________________"
  - "Name: Vikram Sethi, Designation: Designated Partner"
  - For ABC Technologies Pvt. Ltd.
  - "By: ____________________"
  - "Name: Ritu Malhotra, Designation: Chief Operating Officer"

