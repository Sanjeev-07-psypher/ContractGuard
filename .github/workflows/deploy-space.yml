# Deploy the app to a Hugging Face Space (Docker SDK) on every push to main.
# Needs the repository secret HF_TOKEN (a Hugging Face token with the Write role) and
# HF_SPACE ("username/space-name", default Sanjeev-17/contractguard) as a variable or secret.
# Without the token the upload step is skipped with a notice.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || secrets.HF_SPACE || 'Sanjeev-17/contractguard' }}
    steps:
      - name: Check settings
        id: check
        run: |
          if [ -z "$HF_SPACE" ] || [ -z "$HF_TOKEN" ]; then
            echo "::notice::Set the HF_TOKEN secret and the HF_SPACE variable to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.11"

      - name: Stage the files the Space needs
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p space/deploy
          cp -r contractguard backend frontend config policies models space/
          cp Dockerfile .dockerignore pyproject.toml space/
          cp deploy/requirements.txt deploy/start.sh space/deploy/
          mkdir -p space/deploy/certs && touch space/deploy/certs/.gitkeep
          cp deploy/huggingface/README.md space/README.md
          find space -name __pycache__ -prune -exec rm -rf {} +

      - name: Upload to the Space
        if: steps.check.outputs.ready == 'true'
        run: |
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns=["*"],
          )
          print("Uploaded to https://huggingface.co/spaces/" + os.environ["HF_SPACE"])
          PY
